[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-autospeak"
version = "0.1.2"
description = "NoneBot2 定时自动发言插件：群聊/私聊、JSON 配置、多条随机消息、按星期发送、预设占位符"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TangTangChu", email = "tangtangchugasuki@qq.com" },
]
keywords = ["nonebot", "nonebot2", "plugin", "定时", "自动发言", "scheduler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "nonebot2>=2.2.0",
    "nonebot-adapter-onebot>=2.2.0",
    "nonebot-plugin-apscheduler>=0.4.0",
    "nonebot-plugin-localstore>=0.6.0",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/TangTangChu/nonebot-plugin-autospeak"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "nonebug>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["nonebot_plugin_autospeak*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
